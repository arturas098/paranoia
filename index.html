<!DOCTYPE html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Paranoia v9</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;color:#fff;font:15px/1.4 system-ui,sans-serif}
button,input,select{font:inherit;color:#fff;background:#000;border:1px solid #fff;border-radius:6px;padding:8px 12px}
button{cursor:pointer}
button:active{background:#fff;color:#000}
input,select{width:100%}
a{color:#fff}
#app{max-width:640px;margin:0 auto;height:100%;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:6px;padding:10px;border-bottom:1px solid #fff}
header h1{font-size:17px;margin:0;flex:1;letter-spacing:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
header button{padding:6px 9px}
main{flex:1;overflow-y:auto;padding:10px}
.card{border:1px solid #fff;border-radius:8px;padding:10px;margin-bottom:10px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
.badge{border:1px solid #fff;border-radius:10px;padding:0 7px;font-size:12px}
.muted{opacity:.6;font-size:13px}
.banner{border:1px solid #fff;padding:8px 10px;margin:8px 10px 0;border-radius:6px;display:none}
.banner.show{display:block}
.msg{max-width:80%;width:fit-content;border:1px solid #fff;border-radius:10px;padding:6px 10px;margin:6px 0;overflow-wrap:anywhere;user-select:none;-webkit-user-select:none;white-space:pre-wrap}
.me{margin-left:auto;background:#fff;color:#000}
.meta{font-size:11px;opacity:.6}
.sys{text-align:center;margin:6px 0}
footer{display:flex;gap:8px;padding:10px;border-top:1px solid #fff}
footer button{width:56px}
.tip{border:1px dashed #fff;border-radius:8px;padding:8px;font-size:13px;margin-bottom:8px}
label.ck{display:flex;gap:8px;align-items:center;margin:8px 0}
label.ck input{width:auto}
.fl{display:block;margin:10px 0 4px;font-size:13px;opacity:.8}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:#fff;color:#000;padding:6px 12px;border-radius:6px;display:none;max-width:90%}
</style>
</head>
<body>
<div id="app">
  <header><h1 id="title">PARANOIA</h1><span id="hbtns" class="row"></span></header>
  <div id="banner" class="banner"></div>
  <main id="main"></main>
  <footer id="foot" style="display:none"><input id="inp" maxlength="1500" autocomplete="off"><button id="send">➤</button></footer>
</div>
<div id="toast" class="toast"></div>
<script>
'use strict';
const VER='v9';
const DEF='https://ntfy.sh';
const $=s=>document.querySelector(s);
const st={
  get(k,d){try{const v=localStorage.getItem('pn9_'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem('pn9_'+k,JSON.stringify(v))}catch(e){}},
  del(k){try{localStorage.removeItem('pn9_'+k)}catch(e){}}
};
const L={
lt:{newLink:'Nauja nuoroda',label:'Žymė (mato tik tu)',d24:'Ištrinti pokalbį po 24 h',create:'Sukurti ir kopijuoti',copy:'Kopijuoti',open:'Atidaryti',del:'Trinti',sure:'Tikrai?',copied:'Nuoroda nukopijuota',noLinks:'Nuorodų dar nėra.',myLinks:'MANO NUORODOS',joinedChats:'POKALBIAI, Į KURIUOS PRISIJUNGIAU',settings:'Nustatymai',lang:'Kalba',server:'ntfy serveris',serverHint:'Dabar ntfy.sh. Vėliau įrašyk savo telefono Tailscale Funnel adresą (https://…ts.net).',onion:'Atsarginis .onion adresas (nebūtina)',nick:'Tavo slapyvardis',sound:'Garsas (pop-pop)',vib:'Vibracija',silent:'Tylus režimas',save:'Išsaugoti',saved:'Išsaugota',enterNick:'Įvesk slapyvardį, kurį matys pašnekovas',join:'Prisijungti',typeMsg:'Žinutė…',newMsg:'Nauja žinutė',down:'⚠ Ryšys su serveriu nutrūko arba nepatikimas. Bandau jungtis iš naujo…',tryOnion:'Atsarginė onion nuoroda',tip:'Ilgai paspausk žinutę – ištrinsi ją pas save. Dukart bakstelėk – nukopijuosi. ⏱ – dingstančios žinutės, 24h – pokalbis trinamas po paros. Nustatymai galioja abiem.',notif:'Įjungti',notifAsk:'Leisk pranešimus – matysi tik „Nauja žinutė“, be siuntėjo ir teksto.',ttl:'Dingstančios žinutės',off:'išj.',badLink:'Netinkama nuoroda',enc:'Žinutės šifruojamos tavo naršyklėje (AES-256-GCM). Serveris mato tik šifrą ir atsitiktinį kanalo pavadinimą.',cache:'ntfy.sh laiko žinutes ~12 h. Kas neprisijungė per tą laiką, senų žinučių negaus.',set:'pakeitė nustatymus',sendFail:'Nepavyko išsiųsti',deleted:'Ištrinta pas tave',me:'Aš',guest:'Svečias'},
en:{newLink:'New link',label:'Label (only you see it)',d24:'Delete chat after 24 h',create:'Create & copy',copy:'Copy',open:'Open',del:'Delete',sure:'Sure?',copied:'Link copied',noLinks:'No links yet.',myLinks:'MY LINKS',joinedChats:'CHATS I JOINED',settings:'Settings',lang:'Language',server:'ntfy server',serverHint:'Now ntfy.sh. Later enter your phone\'s Tailscale Funnel address (https://…ts.net).',onion:'Backup .onion address (optional)',nick:'Your nickname',sound:'Sound (pop-pop)',vib:'Vibration',silent:'Silent mode',save:'Save',saved:'Saved',enterNick:'Enter the nickname the other person will see',join:'Join',typeMsg:'Message…',newMsg:'New message',down:'⚠ Connection to the server is down or unreliable. Reconnecting…',tryOnion:'Backup onion link',tip:'Long-press a message to delete it on your side. Double-tap to copy. ⏱ = disappearing messages, 24h = chat deleted after a day. Settings apply to both sides.',notif:'Enable',notifAsk:'Allow notifications – you\'ll only see "New message", no sender or text.',ttl:'Disappearing messages',off:'off',badLink:'Invalid link',enc:'Messages are encrypted in your browser (AES-256-GCM). The server only sees ciphertext and a random channel name.',cache:'ntfy.sh keeps messages ~12 h. Anyone offline longer won\'t get older messages.',set:'changed settings',sendFail:'Send failed',deleted:'Deleted on your side',me:'Me',guest:'Guest'}
};
let S=Object.assign({lang:'lt',srv:DEF,onion:'',nick:'',sound:true,vib:true,silent:false},st.get('S',{}));
const T=k=>(L[S.lang]||L.lt)[k]||k;
let links=st.get('links',[]),joined=st.get('joined',[]),unread=st.get('unread',{});
let ME=st.get('me',null);if(!ME){ME=rid(8);st.set('me',ME)}
let cur=null,view='home',pending=null,swReg=null,rt=null;
const keyCache={},seen=new Set(),ES={};

/* ---------- utils ---------- */
function b64u(buf){const a=new Uint8Array(buf);let s='';for(const x of a)s+=String.fromCharCode(x);return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function ub64u(s){s=s.replace(/-/g,'+').replace(/_/g,'/');s+='==='.slice((s.length+3)%4);return Uint8Array.from(atob(s),c=>c.charCodeAt(0))}
function rid(n=12){return b64u(crypto.getRandomValues(new Uint8Array(n)))}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function tm(t){return new Date(t).toLocaleTimeString(S.lang==='lt'?'lt-LT':'en-GB',{hour:'2-digit',minute:'2-digit'})}
function ttlLabel(s){return !s?T('off'):s<60?s+'s':s<3600?(s/60)+'m':(s/3600)+'h'}
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(e._t);e._t=setTimeout(()=>e.style.display='none',1800)}
function copyText(t,msg){
  const fb=()=>{const i=document.createElement('textarea');i.value=t;document.body.appendChild(i);i.select();try{document.execCommand('copy')}catch(e){}i.remove();toast(msg||T('copied'))};
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(()=>toast(msg||T('copied')),fb);else fb();
}

/* ---------- crypto ---------- */
async function key(c){return keyCache[c.t]||(keyCache[c.t]=await crypto.subtle.importKey('raw',ub64u(c.k),'AES-GCM',false,['encrypt','decrypt']))}
async function enc(c,txt){const iv=crypto.getRandomValues(new Uint8Array(12));const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},await key(c),new TextEncoder().encode(txt));return 'p9.'+b64u(iv)+'.'+b64u(ct)}
async function dec(c,s){const[p,iv,ct]=String(s).split('.');if(p!=='p9')throw new Error('fmt');const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:ub64u(iv)},await key(c),ub64u(ct));return new TextDecoder().decode(pt)}

/* ---------- storage ---------- */
const all=()=>links.concat(joined);
const find=t=>all().find(c=>c.t===t);
const srvOf=c=>(c.o?S.srv:(c.s||DEF)).replace(/\/+$/,'');
const msgs=t=>st.get('m_'+t,[]);
const setMsgs=(t,a)=>st.set('m_'+t,a);
const gone=t=>st.get('g_'+t,[]);
const myNick=c=>S.nick||(c&&c.o?T('me'):T('guest'));
function saveAll(){st.set('links',links);st.set('joined',joined);st.set('unread',unread)}
function linkUrl(c){return location.origin+location.pathname+'#t='+c.t+'&k='+c.k+(c.d24?'&d=1':'')+(S.srv.replace(/\/+$/,'')!==DEF?'&s='+encodeURIComponent(S.srv):'')}

/* ---------- ntfy transport ---------- */
function connect(){
  clearTimeout(rt);
  for(const s in ES){ES[s].close();delete ES[s]}
  const groups={};
  for(const c of all()){const s=srvOf(c);(groups[s]=groups[s]||[]).push(c.t)}
  for(const s in groups)openStream(s,groups[s]);
  if(!Object.keys(groups).length)down(false);
}
function openStream(s,topics){
  let es;
  try{es=new EventSource(s+'/'+topics.join(',')+'/sse?since=all')}catch(e){down(true);return}
  ES[s]=es;
  es.onopen=()=>down(false);
  es.onmessage=e=>{let j;try{j=JSON.parse(e.data)}catch(x){return}onNtfy(j)};
  es.onerror=()=>{down(true);es.close();if(ES[s]===es)delete ES[s];clearTimeout(rt);rt=setTimeout(connect,5000)};
}
async function post(c,p){
  const r=await fetch(srvOf(c)+'/'+c.t,{method:'POST',body:await enc(c,JSON.stringify(p))});
  if(!r.ok)throw new Error('HTTP '+r.status);
}
function down(on){
  const b=$('#banner');
  if(!on){b.classList.remove('show');return}
  b.innerHTML=esc(T('down'))+(S.onion?'<br><a href="'+esc(S.onion)+'" target="_blank" rel="noopener">'+esc(T('tryOnion'))+'</a>':'');
  b.classList.add('show');
}
async function onNtfy(j){
  if(!j||j.event!=='message'||seen.has(j.id))return;
  seen.add(j.id);
  const c=find(j.topic);if(!c)return;
  let p;try{p=JSON.parse(await dec(c,j.message))}catch(e){return}
  if(!p||!p.i||!p.t)return;
  if(p.k==='set'){
    if(p.t>(c.st||0)){c.st=p.t;c.ttl=p.ttl|0;c.d24=!!p.d24;saveAll();if(cur===c&&view==='chat')renderChat()}
    addMsg(c,{i:p.i,sys:1,u:p.u,t:p.t,m:(p.n||'?')+' '+T('set')+': ⏱ '+ttlLabel(p.ttl|0)+', 24h '+(p.d24?'✓':'✗')});
    return;
  }
  addMsg(c,{i:p.i,u:p.u,n:p.n,t:p.t,x:p.x||0,m:String(p.m||'').slice(0,2000)});
}
function addMsg(c,p){
  const now=Date.now();
  if(p.x&&p.x<now)return;
  if(c.d24&&now-p.t>864e5)return;
  const a=msgs(c.t);
  if(a.some(m=>m.i===p.i)||gone(c.t).includes(p.i))return;
  a.push(p);a.sort((x,y)=>x.t-y.t);setMsgs(c.t,a);
  if(p.u!==ME&&!p.sys){
    const active=cur===c&&view==='chat'&&!document.hidden;
    if(!active){unread[c.t]=(unread[c.t]||0)+1;saveAll()}
    alertNew();
  }
  if(cur===c&&view==='chat')renderMsgs();else if(view==='home')renderHome();
}

/* ---------- alerts ---------- */
let ac=null,alertT=null;
function pop(){
  try{
    ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    const t0=ac.currentTime;
    [0,.14].forEach(d=>{const o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.value=900;
      g.gain.setValueAtTime(.0001,t0+d);g.gain.exponentialRampToValueAtTime(.3,t0+d+.01);g.gain.exponentialRampToValueAtTime(.0001,t0+d+.09);
      o.connect(g);g.connect(ac.destination);o.start(t0+d);o.stop(t0+d+.1)});
  }catch(e){}
}
function alertNew(){
  clearTimeout(alertT);
  alertT=setTimeout(()=>{
    if(!S.silent){if(S.sound)pop();if(S.vib&&navigator.vibrate)try{navigator.vibrate([40,70,40])}catch(e){}}
    if(document.hidden&&'Notification' in window&&Notification.permission==='granted'){
      const o={body:T('newMsg'),tag:'paranoia',renotify:true,silent:S.silent};
      try{if(swReg)swReg.showNotification('Paranoia',o);else new Notification('Paranoia',o)}catch(e){}
    }
  },400);
}
function notifCard(){
  if(!('Notification' in window)||Notification.permission!=='default')return '';
  return '<div class="card row"><span class="grow muted" style="opacity:.9">'+esc(T('notifAsk'))+'</span><button data-a="notif">'+esc(T('notif'))+'</button></div>';
}

/* ---------- views ---------- */
function hb(h){$('#hbtns').innerHTML=h}
function render(){
  $('#foot').style.display=view==='chat'?'flex':'none';
  ({home:renderHome,chat:renderChat,settings:renderSettings,nick:renderNick})[view]();
}
function chatCard(c,own){
  const u=unread[c.t]||0,last=msgs(c.t).filter(m=>!m.sys).slice(-1)[0];
  return '<div class="card"><div class="row"><b class="grow">'+esc(c.label||'Paranoia')+'</b>'+(u?'<span class="badge">'+u+'</span>':'')+(c.d24?'<span class="badge">24h</span>':'')+(c.ttl?'<span class="badge">⏱'+ttlLabel(c.ttl)+'</span>':'')+'</div>'
   +'<div class="muted">'+(last?esc((last.n||'')+': '+last.m.slice(0,40)):'—')+'</div>'
   +'<div class="row" style="margin-top:8px"><button data-a="open" data-t="'+c.t+'">'+esc(T('open'))+'</button>'
   +(own?'<button data-a="copy" data-t="'+c.t+'">'+esc(T('copy'))+'</button>':'')
   +'<button data-a="del" data-t="'+c.t+'">'+esc(T('del'))+'</button></div></div>';
}
function renderHome(){
  cur=null;$('#title').textContent='PARANOIA '+VER;hb('<button data-a="settings" title="'+esc(T('settings'))+'">⚙</button>');
  let h=notifCard();
  h+='<div class="card"><b>'+esc(T('newLink'))+'</b><input id="lbl" placeholder="'+esc(T('label'))+'" style="margin:8px 0" maxlength="40">'
    +'<label class="ck"><input type="checkbox" id="d24"> '+esc(T('d24'))+'</label><button data-a="create">'+esc(T('create'))+'</button></div>';
  h+='<div class="muted" style="margin:6px 0 8px">'+esc(T('myLinks'))+'</div>';
  if(!links.length)h+='<div class="muted" style="margin-bottom:10px">'+esc(T('noLinks'))+'</div>';
  for(const c of links)h+=chatCard(c,true);
  if(joined.length){h+='<div class="muted" style="margin:12px 0 8px">'+esc(T('joinedChats'))+'</div>';for(const c of joined)h+=chatCard(c,false)}
  h+='<p class="muted">'+esc(T('enc'))+'</p><p class="muted">'+esc(T('cache'))+'</p>';
  $('#main').innerHTML=h;
}
function renderChat(){
  const c=cur;$('#title').textContent=c.label||'Paranoia';
  hb('<button data-a="ttl" title="'+esc(T('ttl'))+'">⏱ '+esc(ttlLabel(c.ttl))+'</button><button data-a="d24t">24h '+(c.d24?'✓':'✗')+'</button><button data-a="home">✕</button>');
  $('#main').innerHTML=notifCard()+'<div class="tip">'+esc(T('tip'))+'</div><div id="msgs"></div>';
  $('#inp').placeholder=T('typeMsg');
  renderMsgs();
}
function renderMsgs(){
  const box=$('#msgs');if(!box||!cur)return;const now=Date.now();
  box.innerHTML=msgs(cur.t).map(m=>m.sys
    ?'<div class="muted sys">'+esc(m.m)+'</div>'
    :'<div class="msg'+(m.u===ME?' me':'')+'" data-i="'+esc(m.i)+'"><div class="meta">'+esc(m.n||'?')+' · '+tm(m.t)+(m.x?' · ⏱'+Math.max(0,Math.ceil((m.x-now)/1000))+'s':'')+(m.f?' · ⚠':'')+'</div>'+esc(m.m)+'</div>').join('');
  const mn=$('#main');mn.scrollTop=mn.scrollHeight;
}
function renderSettings(){
  cur=null;$('#title').textContent=T('settings');hb('<button data-a="home">✕</button>');
  const ck=(id,v,l)=>'<label class="ck"><input type="checkbox" id="'+id+'"'+(v?' checked':'')+'> '+esc(l)+'</label>';
  $('#main').innerHTML='<div class="card">'
   +'<span class="fl">'+esc(T('lang'))+'</span><select id="s_lang"><option value="lt"'+(S.lang==='lt'?' selected':'')+'>Lietuvių</option><option value="en"'+(S.lang==='en'?' selected':'')+'>English</option></select>'
   +'<span class="fl">'+esc(T('nick'))+'</span><input id="s_nick" maxlength="24" value="'+esc(S.nick)+'">'
   +'<span class="fl">'+esc(T('server'))+'</span><input id="s_srv" value="'+esc(S.srv)+'"><div class="muted">'+esc(T('serverHint'))+'</div>'
   +'<span class="fl">'+esc(T('onion'))+'</span><input id="s_onion" placeholder="http://….onion" value="'+esc(S.onion)+'">'
   +ck('s_sound',S.sound,T('sound'))+ck('s_vib',S.vib,T('vib'))+ck('s_silent',S.silent,T('silent'))
   +'<button data-a="save">'+esc(T('save'))+'</button></div><p class="muted">Paranoia '+VER+' · ntfy</p>';
}
function renderNick(){
  $('#title').textContent='PARANOIA';hb('');
  $('#main').innerHTML='<div class="card"><span class="fl">'+esc(T('enterNick'))+'</span><input id="n_nick" maxlength="24" value="'+esc(S.nick)+'" style="margin-bottom:10px"><button data-a="join">'+esc(T('join'))+'</button></div><p class="muted">'+esc(T('enc'))+'</p>';
  setTimeout(()=>{const i=$('#n_nick');if(i)i.focus()},50);
}
function openChat(c){cur=c;view='chat';unread[c.t]=0;saveAll();render()}

/* ---------- actions ---------- */
async function sendText(){
  const v=$('#inp').value.trim();if(!v||!cur)return;
  const c=cur,p={i:rid(),u:ME,n:myNick(c),t:Date.now(),m:v.slice(0,1500)};
  if(c.ttl)p.x=p.t+c.ttl*1000;
  $('#inp').value='';addMsg(c,p);
  try{await post(c,p)}catch(e){const a=msgs(c.t),m=a.find(y=>y.i===p.i);if(m){m.f=1;setMsgs(c.t,a)}renderMsgs();toast(T('sendFail'))}
}
async function sendSet(c){
  const p={k:'set',i:rid(),u:ME,n:myNick(c),t:Date.now(),ttl:c.ttl|0,d24:!!c.d24};
  c.st=p.t;saveAll();renderChat();
  try{await post(c,p)}catch(e){toast(T('sendFail'))}
}
function delChat(t){
  links=links.filter(c=>c.t!==t);joined=joined.filter(c=>c.t!==t);delete unread[t];
  st.del('m_'+t);st.del('g_'+t);saveAll();connect();render();
}
function delLocal(i){
  if(!cur)return;const t=cur.t;
  setMsgs(t,msgs(t).filter(m=>m.i!==i));const g=gone(t);g.push(i);st.set('g_'+t,g.slice(-500));
  renderMsgs();toast(T('deleted'));
}
const TTLS=[0,30,300,3600];
function act(a,t,b){
  if(a==='settings'){view='settings';render()}
  else if(a==='home'){view='home';render()}
  else if(a==='create'){
    const c={o:1,t:'pn'+rid(15),k:rid(32),label:($('#lbl').value.trim()||('#'+(links.length+1))),d24:$('#d24').checked,ttl:0,c:Date.now()};
    links.unshift(c);saveAll();connect();copyText(linkUrl(c));render();
  }
  else if(a==='copy'){const c=find(t);if(c)copyText(linkUrl(c))}
  else if(a==='open'){const c=find(t);if(c)openChat(c)}
  else if(a==='del'){
    if(b.dataset.sure){delChat(t);return}
    b.dataset.sure='1';b.textContent=T('sure');setTimeout(()=>{if(b.isConnected){delete b.dataset.sure;b.textContent=T('del')}},3000);
  }
  else if(a==='ttl'&&cur){cur.ttl=TTLS[(TTLS.indexOf(cur.ttl|0)+1)%TTLS.length];sendSet(cur)}
  else if(a==='d24t'&&cur){cur.d24=!cur.d24;sendSet(cur)}
  else if(a==='notif'){try{Notification.requestPermission().then(()=>render())}catch(e){}}
  else if(a==='save'){
    let srv=$('#s_srv').value.trim()||DEF;if(!/^https?:\/\//.test(srv))srv='https://'+srv;
    S={lang:$('#s_lang').value,nick:$('#s_nick').value.trim(),srv:srv.replace(/\/+$/,''),onion:$('#s_onion').value.trim(),sound:$('#s_sound').checked,vib:$('#s_vib').checked,silent:$('#s_silent').checked};
    st.set('S',S);document.documentElement.lang=S.lang;connect();toast(T('saved'));view='home';render();
  }
  else if(a==='join'){
    const v=$('#n_nick').value.trim();if(!v){$('#n_nick').focus();return}
    S.nick=v;st.set('S',S);if(pending){const c=pending;pending=null;openChat(c)}else{view='home';render()}
  }
}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b)act(b.dataset.a,b.dataset.t,b)});
$('#send').addEventListener('click',sendText);
$('#inp').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendText()}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='n_nick')act('join')});

/* gestures: long-press = delete locally, double-tap = copy */
let lp=null;
const mainEl=$('#main');
mainEl.addEventListener('pointerdown',e=>{const m=e.target.closest('.msg');if(!m)return;clearTimeout(lp);lp=setTimeout(()=>delLocal(m.dataset.i),650)});
['pointerup','pointerleave','pointercancel'].forEach(ev=>mainEl.addEventListener(ev,()=>clearTimeout(lp)));
mainEl.addEventListener('scroll',()=>clearTimeout(lp),{passive:true});
mainEl.addEventListener('dblclick',e=>{const m=e.target.closest('.msg');if(!m||!cur)return;clearTimeout(lp);const x=msgs(cur.t).find(y=>y.i===m.dataset.i);if(x)copyText(x.m)});

/* expiry: disappearing messages + 24 h */
setInterval(()=>{
  const now=Date.now();
  for(const c of all()){
    const a=msgs(c.t);if(!a.length)continue;
    const b=a.filter(m=>!(m.x&&m.x<now)&&!(c.d24&&now-m.t>864e5));
    if(b.length!==a.length)setMsgs(c.t,b);
    if(cur===c&&view==='chat'&&(b.length!==a.length||b.some(m=>m.x)))renderMsgs();
  }
},3000);

document.addEventListener('visibilitychange',()=>{if(!document.hidden&&cur&&view==='chat'){unread[cur.t]=0;saveAll()}});

/* link handling: #t=<topic>&k=<key>[&d=1][&s=<server>] — fragment never reaches any server */
function fromHash(){
  const h=location.hash.slice(1);if(!h.includes('t='))return null;
  const q=new URLSearchParams(h),t=q.get('t')||'',k=q.get('k')||'';
  try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}
  if(!/^[A-Za-z0-9_-]{8,64}$/.test(t)||!/^[A-Za-z0-9_-]{43}$/.test(k))return 'bad';
  let c=find(t);
  if(!c){
    let s=q.get('s')||'';if(s&&!/^https?:\/\//.test(s))s='';
    c={o:0,t,k,s,d24:q.get('d')==='1',ttl:0,label:'Paranoia',c:Date.now()};
    joined.unshift(c);saveAll();
  }
  return c;
}
function route(){
  const c=fromHash();
  if(c==='bad'){toast(T('badLink'));view='home'}
  else if(c){if(!c.o&&!S.nick){pending=c;view='nick'}else{cur=c;view='chat';unread[c.t]=0;saveAll()}}
  connect();render();
}
window.addEventListener('hashchange',route);

if('serviceWorker' in navigator&&location.protocol==='https:'){
  navigator.serviceWorker.register('sw.js').then(r=>{swReg=r}).catch(()=>{});
}
document.documentElement.lang=S.lang;
route();
</script>
</body>
</html>
